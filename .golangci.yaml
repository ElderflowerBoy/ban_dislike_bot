version: "2"

run:
  timeout: 10m
  issues-exit-code: 1
  tests: true

output:
  formats:
    text:
      path: stdout
      print-issued-lines: true
      print-linter-name: true
      colors: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - exhaustive
    - goprintffuncname
    - govet
    - ineffassign
    - mirror
    - nakedret
    - nosprintfhostport
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wastedassign
    - whitespace
  settings:
    govet:
      enable:
        - shadow
    nakedret:
      max-func-lines: 25
    exhaustive:
      default-signifies-exhaustive: true

formatters:
  enable:
    - gofmt
    - goimports
